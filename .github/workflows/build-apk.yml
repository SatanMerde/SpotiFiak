name: Build SpotiFiak Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/app-debug.apk release-files/SpotiFiak.apk
          ls -lh release-files/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotiFiak-APK
          path: release-files/SpotiFiak.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "SpotiFiak v1.2.0 — Spicetify Mobile & Résolution des Bugs d'Affichage 🍑"
          body: |
            ## 🍑 SpotiFiak v1.2.0 — Spicetify Mobile APK

            Téléchargez **`SpotiFiak.apk`** ci-dessous et installez-le directement sur votre smartphone Android !

            ### ✨ Nouveautés majeures de la version 1.2.0 :
            - 🍑 **Nouveau Logo Pêche Hybride Spotify (Style SpotiDuck)** : Logo vectoriel épuré combinant pêche stylisée et ondes musicales, appliqué sur l'icône de l'app, l'en-tête du lecteur et la documentation.
            - 📱 **Résolution complète des bugs d'affichage** :
              - Adaptation intégrale du lecteur web Spotify en affichage mobile responsive (100vw).
              - Élimination des panneaux latéraux de bureau (`react-resizable-panels`) et barres de redimensionnement.
              - Correction des erreurs DOM prématurées (`appendChild` sécurisé).
            - 🏪 **Boutique d'Addons Communautaire Enrichie (16 Addons)** :
              - **8 Thèmes** : Peach Sunset, AMOLED Pure Black, Midnight Wave, Aurora Borealis, Retro Synthwave, Forest Green, Ocean Depth, Candy Pop.
              - **8 Extensions** : Lyrics+, Audio Visualizer, Sleep Timer, Equalizer Pro, Stats Dashboard, Smart Ad Skipper, Queue Manager+, Genre Explorer.
              - **Barre de recherche en temps réel** (par nom, mots-clés, auteur ou tag).
              - **Filtres par type** (Tout, Thèmes, Extensions) et **tri dynamique** (Populaires, Notes, A-Z, Récents).
              - **Carrousel "Mis en avant"** et fonctionnalité de désinstallation en direct.
              - **Notifications visuelles toasts in-app**.
            - ✏️ **Onglet CSS Personnalisé** avec snippets rapides prédéfinis.
            - 📜 **Informations Légales & Confidentialité** : Ajout de `docs/LEGAL.md` et `docs/PRIVACY.md` garantissant un projet open-source respectueux et sans aucune télémétrie.
          files: release-files/SpotiFiak.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Temporary Issues and Branches
        if: success()
        run: |
          gh issue close 1 --comment "Build réussi !" || true
          gh issue close 2 --comment "Build réussi !" || true
          gh issue close 3 --comment "Build réussi !" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" --delete build-log || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
