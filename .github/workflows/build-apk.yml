name: Build SpotiFiak Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/app-debug.apk release-files/SpotiFiak.apk
          ls -lh release-files/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotiFiak-APK
          path: release-files/SpotiFiak.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "SpotiFiak v1.0.0 — Android APK"
          body: |
            ## 🎵 SpotiFiak Mobile APK (Style SpotiDuck)

            Téléchargez **`SpotiFiak.apk`** ci-dessous et installez-le directement sur votre téléphone Android !

            ### ✨ Fonctionnalités :
            - 🎧 **Spotify Web Player** intégré avec affichage optimisé mobile
            - 🏪 **Marketplace** avec 10 addons pré-installés (thèmes, extensions, apps)
            - 🔗 **Compatibilité Spicetify PC** (émulation de l'API Spicetify)
            - ⏯️ **Contrôles écran de verrouillage** (MediaSession) & lecture en arrière-plan sans coupure
            - 🚫 **Ad Skipper** et **Lyrics+** inclus
          files: release-files/SpotiFiak.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Temporary Issues and Branches
        if: success()
        run: |
          gh issue close 1 --comment "Build réussi !" || true
          gh issue close 2 --comment "Build réussi !" || true
          gh issue close 3 --comment "Build réussi !" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" --delete build-log || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
