name: Build SpotiFiak Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV

      - name: Prepare APK for Release
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/app-debug.apk release-files/SpotiFiak.apk
          ls -lh release-files/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotiFiak-APK
          path: release-files/SpotiFiak.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.TAG }}
          name: "SpotiFiak ${{ env.TAG }} — Auto-Mise à Jour In-App & Spicetify Mobile 🍑"
          body: |
            ## 🍑 SpotiFiak ${{ env.TAG }} — Spicetify Mobile APK

            Téléchargez **`SpotiFiak.apk`** ci-dessous ou effectuez la mise à jour directement depuis l'application dans l'onglet **⚙️ Réglages** !

            ### ✨ Nouveautés de la version ${{ env.VERSION }} :
            - 🚀 **Auto-mise à jour in-app en 1 clic** : Détection automatique des mises à jour GitHub Releases, téléchargement avec barre de progression et installation directe sans désinstaller ni perdre ses données.
            - 🍑 **Nouveau Logo Pêche Hybride Spotify (Style SpotiDuck)** : Logo vectoriel épuré combinant pêche stylisée et ondes musicales, appliqué sur l'icône de l'app, l'en-tête du lecteur et la documentation.
            - 📱 **Interface Spicetify Mobile Responsive** : Plein écran natif (100vw), barre de navigation tactile, tiroir bibliothèque fluide.
            - 🏪 **Boutique d'Addons Communautaire Enrichie (16 Addons)** :
              - **8 Thèmes** : Peach Sunset, AMOLED Pure Black, Midnight Wave, Aurora Borealis, Retro Synthwave, Forest Green, Ocean Depth, Candy Pop.
              - **8 Extensions** : Lyrics+, Audio Visualizer, Sleep Timer, Equalizer Pro, Stats Dashboard, Smart Ad Skipper, Queue Manager+, Genre Explorer.
              - Barre de recherche en temps réel, filtres par type, tri dynamique et désinstallation en direct.
            - ✏️ **Éditeur CSS Personnalisé** avec snippets prédéfinis.
            - 📜 **Informations Légales & Confidentialité** : Projet open-source sans collecte de données personnelles.
          files: release-files/SpotiFiak.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Temporary Issues and Branches
        if: success()
        run: |
          gh issue close 1 --comment "Build réussi !" || true
          gh issue close 2 --comment "Build réussi !" || true
          gh issue close 3 --comment "Build réussi !" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" --delete build-log || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
